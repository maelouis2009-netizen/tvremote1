name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev ant

      - name: Use system Ant (avoids flaky download)
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -sfn /usr/share/ant ~/.buildozer/android/platform/apache-ant-1.9.4

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Generate ADB key
        run: |
          pip install adb-shell
          mkdir -p assets
          python -c "from adb_shell.auth.keygen import keygen; keygen('assets/adbkey.txt')"
          mv assets/adbkey.txt.pub assets/adbkey.pub.txt

      - name: Build APK (3 attempts)
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== Tentative $i ==="
            buildozer -v android debug 2>&1 | tee -a build.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then exit 0; fi
            sleep 20
          done
          exit 1

      - name: Show the error
        if: failure()
        shell: bash
        run: |
          echo "===== ERREURS ====="
          grep -n -E "What went wrong|Execution failed|error:|Error:|FAILED|SyntaxError|URLError|Could not" build.log | tail -30
          echo "===== FIN DU LOG ====="
          grep -v "^#" build.log | tail -n 50

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvremote-apk
          path: bin/*.apk
