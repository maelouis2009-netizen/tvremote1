name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-pip python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf libtool pkg-config libunwind-dev
    
    - name: Install Buildozer
      run: |
        pip install buildozer cython==0.29.36
    
    - name: Build APK
      run: |
        buildozer init
        sed -i 's/requirements = python3/requirements = python3==3.11.8,kivy==2.3.0,pyjnius/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        buildozer -v android debug
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TVRemote-APK
        path: bin/*.apk
